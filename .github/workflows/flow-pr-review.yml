name: Flow Pull Request Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  collect-info:
    name: 🔍 Collect PR Info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub

      - name: Run PR Info Collector
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          # Faz com que o pickle seja escrito na workspace
          RUNNER_TEMP:    ${{ github.workspace }}
        run: python src/collect_pr_info.py

      - name: Upload PR Info artifact
        uses: actions/upload-artifact@v3
        with:
          name: pr-info
          path: |
            ${{ github.workspace }}/pr_*.pkl

  add-description:
    name: 📝 Add PR Description
    needs: collect-info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download PR Info artifact
        uses: actions/download-artifact@v3
        with:
          name: pr-info
          path: ${{ github.workspace }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyGithub python-dotenv

      - name: Run PR Description Generator
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          TOKEN_LLM_API:  ${{ secrets.TOKEN_LLM_API }}
          FLOW_LANG:      ${{ secrets.FLOW_LANG }}
          # Faz o script procurar na workspace
          RUNNER_TEMP:    ${{ github.workspace }}
        run: python src/add_pr_description.py

  code-review:
    name: 🔍 Code Review Analysis
    needs: collect-info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Download PR Info artifact
        uses: actions/download-artifact@v3
        with:
          name: pr-info
          path: ${{ github.workspace }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyGithub python-dotenv

      - name: Run Code Reviewer
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          TOKEN_LLM_API:  ${{ secrets.TOKEN_LLM_API }}
          FLOW_LANG:      ${{ secrets.FLOW_LANG }}
          RUNNER_TEMP:    ${{ github.workspace }}
        run: python src/code_review.py
