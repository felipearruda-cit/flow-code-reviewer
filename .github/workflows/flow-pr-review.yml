name: Flow Pull Request Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  flow-ai-reviewer:
    name: Flow Code Reviewer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyGithub python-dotenv openai

      - name: 🔍 Collect PR Info
        env:
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          RUNNER_TEMP:     ${{ runner.temp }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python src/collect_pr_info.py

      - name: 📝 Add PR Description
        env:
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          AUTH_CLIENT_ID:       ${{ secrets.AUTH_CLIENT_ID }}
          AUTH_CLIENT_SECRET:   ${{ secrets.AUTH_CLIENT_SECRET }}
          AUTH_APP_TO_ACCESS:   ${{ secrets.AUTH_APP_TO_ACCESS }}
          AUTH_ENGINE_URL:      ${{ secrets.AUTH_ENGINE_URL }}
          RUNNER_TEMP:          ${{ runner.temp }}
          FLOW_LANG:            ${{ secrets.FLOW_LANG }}
        run: python src/add_pr_description.py

      - name: 🔍 Code Review Analysis
        env:
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          AUTH_CLIENT_ID:       ${{ secrets.AUTH_CLIENT_ID }}
          AUTH_CLIENT_SECRET:   ${{ secrets.AUTH_CLIENT_SECRET }}
          AUTH_APP_TO_ACCESS:   ${{ secrets.AUTH_APP_TO_ACCESS }}
          AUTH_ENGINE_URL:      ${{ secrets.AUTH_ENGINE_URL }}
          RUNNER_TEMP:          ${{ runner.temp }}
          FLOW_LANG:            ${{ secrets.FLOW_LANG }}
        run: python src/code_review.py
