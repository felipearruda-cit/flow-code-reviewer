name: AI Pull Request Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    environment: ai-pr-review # Especifica o ambiente a ser usado
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyGithub python-dotenv
      
      - name: 🔍 Collect PR Info
        id: collect-info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT_NAME: ${{ github.environment }}
        run: |
          python .github/workflows/scripts/collect_pr_info.py
          
      - name: 📝 Add PR Description
        id: add-description
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_LLM_API: ${{ secrets.TOKEN_LLM_API }}
          ENVIRONMENT_NAME: ${{ github.environment }}
          AI_API_URL: ${{ vars.AI_API_URL || 'https://flow.ciandt.com/ai-orchestration-api/v1/openai/chat/completions' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4o-mini' }}
        run: |
          python .github/workflows/scripts/add_pr_description.py
          
      - name: 🔍 Code Review Analysis
        id: code-review
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_LLM_API: ${{ secrets.TOKEN_LLM_API }}
          ENVIRONMENT_NAME: ${{ github.environment }}
          AI_API_URL: ${{ vars.AI_API_URL || 'https://flow.ciandt.com/ai-orchestration-api/v1/openai/chat/completions' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4o-mini' }}
        run: |
          python .github/workflows/scripts/code_review.py