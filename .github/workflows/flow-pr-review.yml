name: Flow Pull Request Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  collect-info:
    name: 🔍 Collect PR Info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with: 
            fetch-depth: 0

      - uses: actions/setup-python@v4
        with: 
          python-version: '3.10'

      - run: |
          pip install PyGithub
        name: Install deps

      - run: python src/collect_pr_info.py
        name: Run PR Info Collector
        env:
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          RUNNER_TEMP:      ${{ github.workspace }}

      - name: Upload PR Info artifact
        uses: actions/upload-artifact@v2
        with:
          name: pr-info
          path: |
            ${{ github.workspace }}/pr_*.pkl

  add-description:
    name: 📝 Add PR Description
    needs: collect-info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with: 
          fetch-depth: 0

      - name: Download PR Info artifact
        uses: actions/download-artifact@v2
        with:
          name: pr-info
          path: ${{ github.workspace }}

      - uses: actions/setup-python@v4
        with: 
          python-version: '3.10'

      - run: |
          pip install requests PyGithub python-dotenv
        name: Install deps

      - run: python src/add_pr_description.py
        name: Run PR Description Generator
        env:
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          TOKEN_LLM_API: ${{ secrets.TOKEN_LLM_API }}
          FLOW_LANG:     ${{ secrets.FLOW_LANG }}
          RUNNER_TEMP:   ${{ github.workspace }}

  code-review:
    name: 🔍 Code Review Analysis
    needs: collect-info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with: 
          fetch-depth: 0

      - name: Download PR Info artifact
        uses: actions/download-artifact@v2
        with:
          name: pr-info
          path: ${{ github.workspace }}

      - uses: actions/setup-python@v4
        with: 
          python-version: '3.10'

      - run: |
          pip install requests PyGithub python-dotenv
        name: Install deps

      - run: python src/code_review.py
        name: Run Code Reviewer
        env:
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          TOKEN_LLM_API: ${{ secrets.TOKEN_LLM_API }}
          FLOW_LANG:     ${{ secrets.FLOW_LANG }}
          RUNNER_TEMP:   ${{ github.workspace }}
